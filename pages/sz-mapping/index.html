<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S to Z Domain Mapping Visualization</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <a href="../../index.html" class="home-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Home
    </a>


    <h1>s-Plane to z-Plane Mapping ($z = e^{sT}$)</h1>
    
    <div class="container">
        <div class="controls">
            <div class="control-group">
                <label for="pathSlider">Trace Path (1 → 7 → 1): <span id="pathLabel">Point 1</span></label>
                <input type="range" id="pathSlider" min="0" max="7" step="0.01" value="0">
            </div>
            <div class="control-group">
                <label for="tSlider">Sampling Period (T): <span id="tLabel">1.0</span></label>
                <input type="range" id="tSlider" min="0.5" max="2.0" step="0.1" value="1.0">
            </div>
        </div>

        <div class="canvases">
            <div class="canvas-container">
                <canvas id="sCanvas" width="400" height="400"></canvas>
                <div class="title">S-Plane (s = σ + jω)</div>
            </div>
            <div class="canvas-container">
                <canvas id="zCanvas" width="400" height="400"></canvas>
                <div class="title">Z-Plane (z = r·e^jθ)</div>
            </div>
        </div>

        <div id="readout">Loading...</div>
    </div>

    <script src="script.js"></script>
</body>
</html>

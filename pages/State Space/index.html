<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced State Space Visualizer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Advanced State Space Phase Portrait</h1>
    <div class="subtitle">dx/dt = Ax | Interactive Dynamics, Animation, & Time Response</div>

    <div class="dashboard">
        <div class="panel controls-panel">
            
            <div class="control-section">
                <label class="section-label">System Matrix (A)</label>
                <div class="matrix-wrapper">
                    <div class="matrix-label">A =</div>
                    <div class="matrix-grid">
                        <input type="number" id="a11" value="-0.5" step="0.1">
                        <input type="number" id="a12" value="1" step="0.1">
                        <input type="number" id="a21" value="-1" step="0.1">
                        <input type="number" id="a22" value="-0.5" step="0.1">
                    </div>
                </div>
            </div>

            <div class="control-section">
                <label class="section-label">Presets</label>
                <select id="presetSelect">
                    <option value="stable_focus">Damped Oscillator (Stable Focus)</option>
                    <option value="center">Harmonic Oscillator (Center)</option>
                    <option value="saddle">Saddle Point</option>
                    <option value="stable_node">Overdamped (Stable Node)</option>
                    <option value="unstable_node">Unstable Node</option>
                    <option value="unstable_focus">Unstable Focus</option>
                </select>
            </div>

            <div class="control-section">
                <div class="slider-header">
                    <label class="section-label">Vector Field Density</label>
                    <span id="densityLabel">Medium (40px)</span>
                </div>
                <input type="range" id="densitySlider" min="20" max="80" step="5" value="40">
            </div>

            <div class="button-group">
                <button class="primary" id="updateBtn">Update Vector Field</button>
                <button class="secondary" onclick="clearAllTrajectories()">Clear Trajectories</button>
            </div>

            <div class="metrics-box" id="metricsReadout">
                </div>
        </div>

        <div class="visual-panel">
            <div class="instruction">
                <strong>Left Click:</strong> Drop Particle &nbsp;|&nbsp; <strong>Right-Click Drag:</strong> Pan &nbsp;|&nbsp; <strong>Scroll:</strong> Zoom
            </div>
            
            <div class="canvas-container">
                <canvas id="phaseCanvas" width="650" height="450"></canvas>
            </div>
            
            <div class="canvas-container" style="margin-top: 15px;">
                <div class="chart-title">System Response x(t) (Last Clicked Trajectory)</div>
                <canvas id="timeCanvas" width="650" height="200"></canvas>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

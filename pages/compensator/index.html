<!DOCTYPE html>
<html lang="en">

<head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Interactive Compensator Designer (Bode Plot)</title>
          <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
          <link rel="stylesheet" href="styles.css">
</head>

<body>
    <a href="../../index.html" class="home-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Home
    </a>


          <h1>Interactive Compensator Designer</h1>
          <div class="subtitle">Design Phase Lead / Lag Compensators</div>

          <div class="dashboard">
                    <div class="controls-panel">
                              <h3 style="color: #f9e2af; margin-top: 0;">1. Plant Transfer Function</h3>
                              <div class="input-group">
                                        <label>Numerator N(s) [e.g., 100]</label>
                                        <input type="text" id="numInput" value="100">
                              </div>
                              <div class="input-group">
                                        <label>Denominator D(s) [e.g., 1, 6, 0 for s(s+6)]</label>
                                        <input type="text" id="denInput" value="1, 6, 0">
                              </div>

                              <hr style="border-color: #45475a; width: 100%; margin: 10px 0;">

                              <h3 style="color: #f9e2af; margin-top: 0;">2. Compensator Gc(s)</h3>
                              <div class="formula">Gc(s) = (1 + aTs) / (1 + Ts)</div>

                              <div class="input-group">
                                        <label>Type</label>
                                        <div class="radio-group">
                                                  <label><input type="radio" name="compType" value="lead" checked
                                                                      onchange="updateSliderRanges()"> Phase Lead (a >
                                                            1)</label>
                                                  <label><input type="radio" name="compType" value="lag"
                                                                      onchange="updateSliderRanges()"> Phase Lag (a <
                                                                      1)</label>
                                        </div>
                              </div>

                              <div class="input-group">
                                        <label>Parameter 'a': <span id="aValDisplay"
                                                            class="highlight-val">10.00</span></label>
                                        <input type="range" id="aSlider" min="1.1" max="20" step="0.1" value="10">
                              </div>

                              <div class="input-group">
                                        <label>Time Constant 'T': <span id="tValDisplay"
                                                            class="highlight-val">0.100</span></label>
                                        <input type="range" id="tSlider" min="0.001" max="1" step="0.001" value="0.1">
                              </div>

                              <button onclick="updatePlots()">Update Plant & Render</button>
                    </div>

                    <div class="charts-panel">
                              <div class="chart-container">
                                        <canvas id="magChart"></canvas>
                              </div>
                              <div class="chart-container">
                                        <canvas id="phaseChart"></canvas>
                              </div>
                    </div>
          </div>

          <script src="script.js"></script>
</body>

</html>

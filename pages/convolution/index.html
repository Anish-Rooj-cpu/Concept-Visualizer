<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correlation vs Convolution Visualizer Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <a href="../../index.html" class="home-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Home
    </a>


    <h1>Correlation vs Convolution</h1>
    <p class="subtitle">Interactive Digital Signal Processing Visualizer</p>

    <div class="controls">
        <div class="control-group">
            <label for="mode">Operation Mode:</label>
            <select id="mode">
                <option value="correlation">Cross-Correlation</option>
                <option value="convolution" selected>Convolution</option>
            </select>
        </div>
        <div class="control-group">
            <label for="signal1">Input Signal:</label>
            <select id="signal1">
                <option value="step">Unit Step (Rect)</option>
                <option value="square">Square Wave</option>
                <option value="sine">Sine Wave</option>
                <option value="triangle">Triangular Wave</option>
                <option value="exponential">Exponential Decay</option>
                <option value="random">Random Noise</option>
            </select>
        </div>
        <div class="control-group">
            <label for="signal2">Kernel / Ref Signal:</label>
            <select id="signal2">
                <option value="gaussian" selected>Gaussian Kernel</option>
                <option value="step">Unit Step (Rect)</option>
                <option value="square">Square Wave</option>
                <option value="sine">Sine Wave</option>
                <option value="triangle">Triangular Wave</option>
                <option value="exponential">Exponential Decay</option>
                <option value="random">Random Noise</option>
            </select>
        </div>
        <div class="slider-group">
            <label for="lagSlider">Shift / Lag: <span id="lagValue" class="slider-value">0</span></label>
            <div class="slider-row">
                <button id="playBtn">Play ▶</button>
                <input type="range" id="lagSlider" min="-15" max="15" value="0">
            </div>
        </div>
    </div>

    <div class="live-math">
        <span><strong>Integration at Lag <span id="mathLag">0</span>:</strong> Σ (Input × Kernel)</span>
        <span>= <span id="mathResult" class="result-val">0.00</span></span>
    </div>

    <div class="chart-container">
        <canvas id="chart1"></canvas>
    </div>
    <div class="chart-container">
        <canvas id="chart2"></canvas>
    </div>
    <div class="chart-container">
        <canvas id="chart3"></canvas>
    </div>

    <script src="script.js"></script>
</body>

</html>

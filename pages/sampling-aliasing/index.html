<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sampling Theorem & Aliasing Demonstrator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <a href="../../index.html" class="home-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Home
    </a>


    <h1>Sampling Theorem & Aliasing</h1>
    <div class="subtitle">Time Domain vs. Frequency Domain (Spectrum Replicas)</div>

    <div class="dashboard">

        <div class="panel controls-panel">

            <div class="input-group">
                <label style="color: var(--color-signal)">
                    True Signal Freq (f_sig):
                    <span id="fSigDisplay">5 Hz</span>
                </label>
                <input type="range" id="fSigSlider" min="1" max="40" step="0.5" value="5">
            </div>

            <hr style="border-color: var(--color-grid); width: 100%;">

            <div class="input-group">
                <label style="color: var(--color-samples)">
                    Sampling Freq (f_s):
                    <span id="fsDisplay">25 Hz</span>
                </label>
                <input type="range" id="fsSlider" min="2" max="60" step="1" value="25">
            </div>

            <div class="metrics-box" id="metricsReadout">
            </div>
        </div>

        <div class="panel visual-panel">

            <div class="canvas-container">
                <div class="canvas-title">Time Domain</div>
                <canvas id="waveCanvas" width="800" height="250"></canvas>
            </div>

            <div class="canvas-container">
                <div class="canvas-title">Frequency Domain (Spectrum)</div>
                <canvas id="freqCanvas" width="800" height="250"></canvas>
            </div>

            <div class="legend">
                <div class="legend-item">
                    <div class="color-box" style="background-color: var(--color-signal)">
                    </div>
                    <span style="color: var(--color-signal)">Original Signal</span>
                </div>
                <div class="legend-item">
                    <div class="color-box" style="background-color: var(--color-samples)">
                    </div>
                    <span style="color: var(--color-samples)">Sample Replicas</span>
                </div>
                <div class="legend-item">
                    <div class="color-box" style="background-color: var(--color-alias)">
                    </div>
                    <span style="color: var(--color-alias)">Perceived (Baseband)</span>
                </div>
                <div class="legend-item">
                    <div class="color-box"
                        style="background: var(--color-nyquist); border: 1px solid var(--color-nyquist-border);">
                    </div>
                    <span style="color: var(--color-nyquist-border)">Nyquist Zone [-fs/2,
                        fs/2]</span>
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>

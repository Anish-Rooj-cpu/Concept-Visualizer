<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Nyquist Stability Mapper</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <a href="../../index.html" class="home-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Home
    </a>


    <h1>Universal Nyquist Stability Mapper</h1>
    <div class="subtitle">Enter coefficients for G(s)H(s) to analyze system stability.</div>

    <div class="dashboard">

        <div class="panel controls-panel">
            <div class="input-group">
                <label>Numerator N(s) [e.g. 10]</label>
                <input type="text" id="numInput" value="10">
            </div>

            <div class="input-group">
                <label>Denominator D(s) [e.g. 1, 6, 11, 6]</label>
                <input type="text" id="denInput" value="1, 6, 11, 6">
                <div style="font-size: 11px; color: var(--text-muted);">Coefficients of
                    descending powers of s. Example: s³ + 6s² + 11s + 6</div>
            </div>

            <button onclick="updateSystem()">Update Transfer Function</button>

            <hr style="border-color: var(--border-color); width: 100%; margin: 10px 0;">

            <div class="input-group">
                <label>System Gain (K): <span id="kValDisplay">1.0</span></label>
                <input type="range" id="kSlider" min="0.1" max="150" step="0.1" value="10">
            </div>

            <div class="input-group">
                <label>Trace ω (D-Contour): <span id="wValDisplay">ω = 0.00 rad/s</span></label>
                <input type="range" id="traceSlider" min="-50" max="50" step="0.1" value="0">
            </div>

            <div class="metrics-box" id="metricsReadout">
            </div>
        </div>

        <div class="panel visual-panel">
            <div class="canvas-container">
                <div class="canvas-title">S-Plane (D-Contour)</div>
                <canvas id="sCanvas" width="300" height="400"></canvas>
            </div>

            <div class="arrow">➔</div>

            <div class="canvas-container">
                <div class="canvas-title">G(s)H(s) Plane (Nyquist Plot)</div>
                <canvas id="gCanvas" width="400" height="400"></canvas>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>

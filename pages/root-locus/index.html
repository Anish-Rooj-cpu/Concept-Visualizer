<!DOCTYPE html>
<html lang="en">

<head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Interactive Educational Root Locus</title>
          <link rel="stylesheet" href="styles.css">
</head>

<body>
    <a href="../../index.html" class="home-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Home
    </a>


          <h1>Interactive Root Locus</h1>
          <div class="subtitle">1 + K[N(s)/D(s)] = 0</div>

          <div class="dashboard">
                    <div class="controls-panel">
                              <div class="input-group">
                                        <label>Numerator N(s) [e.g., 1]</label>
                                        <input type="text" id="numInput" value="1">
                              </div>
                              <div class="input-group">
                                        <label>Denominator D(s) [e.g., 1, 6, 8, 0 for s(s+2)(s+4)]</label>
                                        <input type="text" id="denInput" value="1, 6, 8, 0">
                              </div>
                              <button onclick="initializeSystem()">Calculate System & Plot</button>

                              <hr style="border-color: #45475a; width: 100%; margin: 10px 0;">

                              <div class="input-group">
                                        <label>Vary Gain (K): <span id="kValDisplay"
                                                            class="highlight-k">0.00</span></label>
                                        <input type="range" id="kSlider" min="0" max="100" step="0.1" value="0">
                              </div>

                              <div class="metrics-box">
                                        <div style="color: #89b4fa; font-weight: bold; margin-bottom: 5px;">Closed-Loop
                                                  Poles:</div>
                                        <div id="rootsReadout">Calculate system first...</div>

                                        <div
                                                  style="color: #f9e2af; font-weight: bold; margin-top: 15px; margin-bottom: 5px;">
                                                  Marginal Stability (jω Crossings):</div>
                                        <div id="crossingReadout">None</div>
                              </div>
                    </div>

                    <div class="canvas-container">
                              <canvas id="bgCanvas" width="500" height="500"></canvas>
                              <canvas id="fgCanvas" width="500" height="500"></canvas>
                    </div>
          </div>

          <script src="script.js"></script>
</body>

</html>
